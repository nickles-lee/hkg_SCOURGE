# Mode C compat-kernel initramfs. Built with the host kernel and modules; it
# contains only virtio transport/GPU helpers plus the normal block boot hooks.
# The vendor rootfs is attached as virtio-blk and is never modified.

MODULES=(virtio_gpu bochs virtio_input virtio_net 9p 9pnet_virtio usb_storage)
BINARIES=()
FILES=()
HOOKS=(base udev modconf block filesystems)
